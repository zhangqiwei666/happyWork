<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      background: #1e1e1e;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #2a2a2a;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .icon-box {
      width: 256px;
      height: 256px;
      margin-bottom: 24px;
      filter: drop-shadow(0 12px 24px rgba(255, 179, 38, 0.3));
    }
    h2 {
      margin: 0 0 8px 0;
      font-size: 24px;
      color: #FFD15C;
    }
    p {
      margin: 0;
      color: #aaa;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="icon-box" src="app-logo.svg" alt="卡通牛马开心上班图标">
    <h2>心晴解压岛 · “开心上班”牛马专属图标</h2>
    <p>512x512 高清矢量 SVG / 适合做小程序 Logo、头像与分享封面</p>
  </div>
</body>
</html>
